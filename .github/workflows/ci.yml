name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Install a virtual display (Linux GUI smoke test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests (Linux, under Xvfb so the GUI smoke test runs)
        if: runner.os == 'Linux'
        run: xvfb-run -a pytest -v
      - name: Tests
        if: runner.os != 'Linux'
        run: pytest -v
      - name: Example export + verify
        run: |
          aruco-tag-maker generate --names examples/names.txt --out ci-export
          aruco-tag-maker verify ci-export

  launcher:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tk for the system Python (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: python aruco_tag_maker.py from a fresh clone (twice; second run must say good to go)
        shell: bash
        run: |
          python aruco_tag_maker.py doctor < /dev/null
          python aruco_tag_maker.py doctor < /dev/null 2> second.txt
          cat second.txt
          grep -q "Good to go" second.txt
