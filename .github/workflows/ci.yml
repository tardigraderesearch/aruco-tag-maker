name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install ".[test]"
      - name: Install a virtual display (Linux GUI smoke test)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests (Linux, under Xvfb so the GUI smoke test runs)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v
      - name: Tests
        if: runner.os != 'Linux'
        run: python -m pytest -v
      - name: Example export + verify
        run: |
          aruco-tag-maker generate --names examples/names.txt --out ci-export
          aruco-tag-maker verify ci-export

  launcher:
    name: launcher (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tk for the system Python (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: run.sh from a fresh clone (twice; second run must skip the install)
        if: runner.os != 'Windows'
        run: |
          ./run.sh doctor
          ./run.sh doctor | tee second.txt
          grep -q "already installed" second.txt
          ./run.sh generate --names examples/names.txt --out launcher-export
      - name: run.bat from a fresh clone (twice; second run must skip the install)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call run.bat doctor < NUL || exit /b 1
          call run.bat doctor < NUL > second.txt || exit /b 1
          type second.txt
          findstr /c:"already installed" second.txt || exit /b 1
          call run.bat generate --names examples\names.txt --out launcher-export < NUL || exit /b 1
