[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aruco-tag-maker"
version = "0.1.0"
description = "Name your ArUco tags in a small desktop app and export printable two-colour STL tiles plus a name-to-id lookup."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "evilhobo1911" }]
requires-python = ">=3.11"
keywords = ["aruco", "fiducial", "marker", "opencv", "stl", "3d-printing", "computer-vision"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: Tk",
  "Environment :: Win32 (MS Windows)",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
  "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "manifold3d>=2.5",
  "Pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "trimesh>=4.0"]

[project.urls]
Homepage = "https://github.com/evilhobo1911/aruco-tag-maker"
Issues = "https://github.com/evilhobo1911/aruco-tag-maker/issues"

[project.scripts]
aruco-tag-maker = "aruco_tag_maker.cli:main"

[project.gui-scripts]
aruco-tag-maker-gui = "aruco_tag_maker.gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
